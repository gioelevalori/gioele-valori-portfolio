name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: spazio_ci
          POSTGRES_USER: spazio_ci
          POSTGRES_PASSWORD: ephemeral-ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spazio_ci -d spazio_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet restore backend/Spazio.Api --locked-mode
      - run: dotnet build backend/Spazio.Api -c Release --no-restore
      - name: Verify API against PostgreSQL
        env:
          ConnectionStrings__Spazio: Host=localhost;Database=spazio_ci;Username=spazio_ci;Password=ephemeral-ci-test-password
          Database__Initialize: 'true'
          ASPNETCORE_URLS: http://127.0.0.1:5080
        run: |
          dotnet backend/Spazio.Api/bin/Release/net10.0/Spazio.Api.dll > /tmp/spazio-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5080/health > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:5080/health
          node backend/tests/integration.mjs
  build:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Angular
        run: npm run build -- --base-href /
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/portfolio/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
